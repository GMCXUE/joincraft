<!doctype html>
<html lang="zh-CN" class="wa-dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>joincraft · 房间联机</title><link rel="stylesheet" href="/ui.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/polish.css"><link rel="stylesheet" href="/play.css"><script type="module" src="/app.js"></script></head>
<body><header class="titlebar"><a href="#friends" class="wordmark">joincraft</a><div class="title-tools"><button class="button small" data-action="game-library">游戏库</button><span class="preview-label">网页版</span><button class="icon-button" data-action="help" aria-label="使用帮助" title="使用帮助"><span data-icon="help"></span></button></div></header>
<div class="app"><aside class="room-rail" aria-label="房间列表"><a href="#friends" id="friends-entry" aria-labelledby="friends-entry-label" class="rail-home" aria-label="好友与聊天" ><span data-icon="gamepad"></span><span id="friends-entry-label" class="sr-only">好友与聊天</span></a><div class="rail-rule"></div><nav id="room-icons" aria-label="已加入的房间"></nav><button id="add-room-entry" aria-labelledby="add-room-label" class="room-icon add-room" data-action="add" aria-label="添加房间" ><span data-icon="plus"></span><span id="add-room-label" class="sr-only">添加房间</span></button><div class="rail-bottom"><button class="user-avatar" id="account-entry" data-action="profile" aria-label="登录账号" title="登录账号">登录</button></div></aside>
<div class="workspace"><aside class="room-sidebar"><div id="room-heading"></div><nav id="room-nav" aria-label="房间功能"></nav><div id="sidebar-info"></div><div class="sidebar-bottom"><div class="connection-state"><span class="status-dot"></span><div><strong>尚未开房</strong></div><span data-icon="link"></span></div></div></aside>
<section class="content-panel"><header class="content-header"><div><span id="view-icon"></span><h1 id="view-title">开始联机</h1></div><div id="view-tools"></div></header><div id="offline" role="alert" hidden>实时连接已断开，正在重连。请确认后台服务仍在运行。</div><main id="main" tabindex="-1"></main></section></div></div>
<dialog id="room-dialog" aria-labelledby="dialog-title"><button class="icon-button dialog-close" data-action="dismiss" aria-label="关闭窗口"><span data-icon="close"></span></button><div class="dialog-tabs" role="tablist" aria-label="添加房间方式"><button role="tab" id="join-tab" data-action="dialog-join" aria-selected="true">加入房间</button><button role="tab" id="create-tab" data-action="dialog-create" aria-selected="false">创建房间</button></div><div id="room-dialog-body"></div></dialog>
<dialog id="small-dialog" aria-labelledby="small-title"><button class="icon-button dialog-close" data-action="dismiss" aria-label="关闭窗口"><span data-icon="close"></span></button><div id="small-dialog-body"></div></dialog><dialog id="auth-dialog" aria-labelledby="auth-title"><button class="icon-button dialog-close" data-action="dismiss" aria-label="关闭窗口"><span data-icon="close"></span></button><div id="auth-body"></div></dialog><div id="toast" role="status" class="toast" hidden></div><wa-tooltip for="friends-entry" placement="right">好友与聊天</wa-tooltip><wa-tooltip for="add-room-entry" placement="right">加入或创建房间</wa-tooltip></body></html>
