<!doctype html>
<html lang="zh-CN" class="pixel-theme"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><link rel="icon" href="../brand/favicon.svg" type="image/svg+xml"><title>joincraft · 本机游戏库</title><link rel="stylesheet" href="./library.css"><link rel="stylesheet" href="../type.css"><link rel="stylesheet" href="../desktop-notifications.css"><script type="module" src="./library.js"></script><link rel="stylesheet" href="../pixel-theme.css"><link rel="stylesheet" href="../motion.css"></head>
<body>
  <header class="titlebar"><a class="brand" href="../index.html" aria-label="joincraft"><img class="brand-symbol" src="../brand/mark.svg" alt="" width="32" height="32"><svg class="brand-wordmark" viewBox="0 0 57 13" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="M3.0 1.0H5.0V2.0H3.0ZM1.0 4.0H5.0V11.0H4.0V12.0H1.0V11.0H3.0V5.0H1.0ZM7.0 4.0H11.0V5.0H12.0V9.0H11.0V10.0H7.0V9.0H6.0V5.0H7.0ZM8.0 5.0V9.0H10.0V5.0ZM14.0 1.0H16.0V2.0H14.0ZM13.0 4.0H16.0V9.0H17.0V10.0H13.0V9.0H14.0V5.0H13.0ZM18.0 4.0H20.0V5.0H21.0V6.0H20.0V10.0H18.0ZM21.0 4.0H23.0V5.0H24.0V10.0H22.0V5.0H21.0ZM26.0 4.0H30.0V5.0H31.0V6.0H29.0V5.0H27.0V9.0H29.0V8.0H31.0V9.0H30.0V10.0H26.0V9.0H25.0V5.0H26.0ZM32.0 4.0H34.0V5.0H35.0V6.0H34.0V10.0H32.0ZM35.0 4.0H37.0V5.0H35.0ZM39.0 4.0H43.0V5.0H44.0V10.0H39.0V9.0H38.0V7.0H39.0V6.0H42.0V5.0H39.0ZM40.0 7.0V9.0H42.0V7.0ZM47.0 1.0H50.0V2.0H48.0V4.0H50.0V5.0H48.0V10.0H46.0V5.0H45.0V4.0H46.0V2.0H47.0ZM52.0 1.0H54.0V4.0H56.0V5.0H54.0V9.0H56.0V10.0H53.0V9.0H52.0V5.0H51.0V4.0H52.0Z"/></svg></a><span id="surface-label">本机游戏库</span><button id="rooms">返回房间</button></header>
  <div id="web-note" class="web-note" hidden>浏览器预览 · 启动游戏请使用桌面客户端</div>
  <div class="workspace">
    <aside class="library-sidebar"><div class="sidebar-title"><h1>游戏库</h1><span id="instance-count">0</span></div><button id="pick-directory" class="import-button">＋ 选择 PCL 目录</button><p id="root-path" class="root-path">选择已安装整合包所在的文件夹</p><nav id="instances" aria-label="已安装实例"></nav></aside>
    <main>
      <div id="empty" class="empty"><span class="empty-mark" aria-hidden="true">▧</span><h2>添加整合包</h2><p>选择 PCL 目录或 .minecraft 文件夹</p><button id="empty-import">选择整合包目录</button></div>
      <div id="details" hidden>
        <header class="instance-heading"><span id="pack-icon" class="pack-icon" aria-hidden="true"></span><div><p id="pack-meta" class="eyebrow"></p><h2 id="pack-name"></h2><p id="pack-status"></p></div></header>
        <section class="settings-section"><h3>游戏环境</h3><div class="setting"><div><label for="directory-mode">游戏目录</label><p id="isolation-hint"></p></div><select id="directory-mode"><option value="auto">跟随识别结果</option><option value="isolated">独立版本目录</option><option value="shared">共享 .minecraft 目录</option></select></div><p id="game-path" class="path-line"></p><div class="java-setting"><div class="java-heading"><label for="java-select">Java 运行环境</label><div class="java-actions"><button id="scan-java">重新扫描</button><button id="pick-java">手动选择</button></div></div><select id="java-select" aria-describedby="java-hint java-path"><option value="">正在查找 Java…</option></select><p id="java-path" class="path-line"></p><p id="java-hint" class="path-line" role="status"></p></div></section><section class="settings-section memory-section" aria-labelledby="memory-title"><div class="memory-heading"><h3 id="memory-title">内存分配</h3><span id="memory-live-state"></span></div><div class="memory-mode-row"><label for="memory-auto"><input id="memory-auto" type="radio" name="memory-mode" value="auto" checked>自动配置</label><output id="memory-auto-value" for="memory-auto">—</output></div><div class="memory-custom-row"><label for="memory-custom"><input id="memory-custom" type="radio" name="memory-mode" value="custom">自定义</label><input id="memory" type="range" min="512" max="32768" step="256" value="4096" aria-label="自定义内存" disabled><output id="memory-custom-value" for="memory">4.0 GB</output></div><div id="memory-overview" class="memory-overview unavailable"><div class="memory-chart-labels"><span id="memory-system-label">已使用内存</span><span title="游戏堆内存分配上限">游戏分配</span></div><div id="memory-bar" class="memory-bar" role="img" aria-label="内存分配预览"><span id="memory-system-segment" class="memory-segment system" aria-hidden="true"></span><span id="memory-game-segment" class="memory-segment game" aria-hidden="true"></span></div><div class="memory-chart-values"><strong id="memory-system-value">正在读取…</strong><strong id="memory-game-value">—</strong></div></div><p id="memory-warning" class="memory-warning" role="status" hidden></p></section>
        <section class="settings-section"><h3>启动账号</h3><div class="account-tabs" role="group" aria-label="启动账号类型"><button id="offline-tab" aria-pressed="true">离线玩家</button><button id="microsoft-tab" aria-pressed="false">微软正版</button></div><div id="offline-panel" class="account-panel"><label for="player-name">玩家名</label><input id="player-name" maxlength="16" placeholder="3–16 位字母、数字或下划线" autocomplete="off" list="pcl-player-names" value=""><datalist id="pcl-player-names"></datalist><div class="player-source"><span id="player-source"></span><button id="use-pcl-name" hidden>使用 PCL 玩家名</button></div></div><div id="microsoft-panel" class="account-panel" hidden><div class="microsoft-row"><div><strong id="microsoft-name">尚未登录</strong><p id="microsoft-hint">使用拥有 Java 版的微软账号。</p></div><button id="login">登录微软账号</button><button id="logout" hidden>退出</button></div><div id="device-code" hidden><p>在微软授权页输入此代码</p><strong id="code"></strong><button id="open-microsoft">打开微软授权页</button><p>授权完成后会自动返回登录结果。</p></div></div></section>
        <footer class="launch-footer"><div><p id="check-result" role="status"></p><p id="launch-hint" role="status"></p></div><div class="launch-actions"><button id="check">检查文件</button><button id="launch" class="primary">启动游戏</button></div></footer>
      </div>
      <p id="message" class="message" role="alert" hidden></p>
    </main>
  </div>
</body></html>
