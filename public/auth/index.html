<div class="scene-panel"><img class="world" src="/auth/mine-v2.webp" width="1672" height="941" alt="" fetchpriority="high"></div>
<section class="account" aria-labelledby="account-title">
<div class="account-content">
<h1 id="account-title">登录 joincraft</h1>
<div id="desktop-context" class="desktop-context" hidden><p>登录到桌面客户端</p><div><span>登录编号</span><strong id="desktop-code"></strong></div><p class="desktop-caution">仅确认你刚从客户端发起的登录。</p></div>
<section id="desktop-account" class="desktop-account" hidden aria-label="确认登录账号"><div class="desktop-identity"><strong id="desktop-name"></strong><span id="desktop-username"></span></div><button id="desktop-confirm" class="submit" type="button">确认登录客户端</button><button id="desktop-switch" class="quiet-button" type="button">换个账号</button></section>
<section id="desktop-result" class="desktop-result" hidden aria-live="polite" aria-atomic="true"><span class="result-mark" id="desktop-mark" aria-hidden="true"></span><h2 id="desktop-result-title"></h2><p id="desktop-result-note"></p></section>
<p id="desktop-error" class="form-error" role="alert" hidden></p>
<form id="account-form" method="post" action="/api/auth/login">
<fieldset id="account-fields">
<div class="field"><label for="username">账号</label><input id="username" name="username" type="text" placeholder="用户名" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" title="3–24 位字母、数字或下划线" required></div>
<div class="field"><label for="password">密码</label><div class="password-control"><input id="password" name="password" type="password" placeholder="输入密码" autocomplete="current-password" maxlength="64" aria-describedby="password-hint" required><button class="password-toggle" type="button" data-password="password" aria-label="显示密码" aria-pressed="false">显示</button></div><p id="password-hint" class="field-hint" hidden>10–64 个字符</p></div>
<div id="confirm-field" class="field" hidden><label for="confirm">确认密码</label><div class="password-control"><input id="confirm" name="confirm" type="password" placeholder="再次输入密码" autocomplete="new-password" maxlength="64" disabled><button class="password-toggle" type="button" data-password="confirm" aria-label="显示确认密码" aria-pressed="false">显示</button></div></div>
<p id="form-error" class="form-error" role="alert" aria-atomic="true"></p>
<button id="submit" class="submit" type="submit">登录</button>
</fieldset>
</form>
<p class="account-switch"><span id="switch-caption">还没有账号？</span><button id="switch-mode" type="button">创建账号</button></p>
<button id="desktop-cancel" class="quiet-button desktop-cancel" type="button" hidden>取消此次登录</button>
</div>
</section>
<noscript><p class="script-note">请启用 JavaScript 后登录。</p></noscript>
</main>
</body></html>
