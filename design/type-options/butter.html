:root{color-scheme:light;--mist:#f1f4e8;--forest:#243e2a;--moss:#52634a;--grass:#94cc56;--grass-edge:#668d40;--field-border:#b5c3a8;--error:#a33126;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-synthesis:none;color:var(--forest);background:var(--mist);-webkit-font-smoothing:antialiased;}
*{box-sizing:border-box;}[hidden]{display:none!important;}body{margin:0;}button,input{font:inherit;}button,a{-webkit-tap-highlight-color:transparent;}button{cursor:pointer;}a{color:inherit;text-decoration:none;}button:focus-visible,a:focus-visible{outline:3px solid var(--forest);outline-offset:5px;}
.login-page{position:relative;isolation:isolate;min-height:max(720px,100svh);display:grid;grid-template-columns:57% 43%;align-items:center;overflow:hidden;}
.world{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;z-index:-1;pointer-events:none;user-select:none;}
.site-header{position:absolute;inset:30px auto auto 40px;}
.site-brand{display:flex;align-items:center;gap:8px;width:fit-content;}.site-brand>img{width:46px;height:46px;}.brand-wordmark{width:156px;height:32px;}.brand-wordmark g{stroke-width:3.2;}
.scene-copy{position:absolute;left:44px;top:132px;pointer-events:none;}.scene-copy p{font-family:JoincraftPixel,'PingFang SC','Microsoft YaHei',sans-serif;font-size:60px;font-weight:400;line-height:1.3;letter-spacing:2px;margin:0;color:#263e29;-webkit-text-stroke:2px #f4f2da;paint-order:stroke fill;text-shadow:3px 3px 0 #f4f2da;-webkit-font-smoothing:none;text-wrap:balance;}.scene-copy span{display:block;}
.account{grid-column:2;padding:112px clamp(32px,4vw,80px) 64px 24px;}
.account-content{width:min(100%,380px);margin:auto;animation:arrive 220ms ease both;}
h1{font-size:clamp(26px,2.4vw,34px);font-weight:650;letter-spacing:-.035em;line-height:1.25;margin:0 0 36px;}fieldset{border:0;margin:0;padding:0;min-width:0;}
.field+.field{margin-top:22px;}.field>label{display:block;font-size:14px;font-weight:600;line-height:1.5;margin-bottom:9px;}
.field input{display:block;width:100%;min-width:0;height:52px;border:1px solid var(--field-border);border-radius:7px;padding:0 15px;background:#fff9;color:var(--forest);outline:none;font-size:16px;line-height:1.4;transition:border-color 140ms,box-shadow 140ms,background 140ms;}.field input::placeholder{color:#7b8772;opacity:1;}.field input:hover{border-color:#899d79;}.field input:focus{border-color:#567642;box-shadow:0 0 0 3px #668d4026;background:#fffffff0;}.field input[aria-invalid=true]{border-color:var(--error);}
.password-control{position:relative;}.password-control input{padding-right:65px;}.password-toggle{position:absolute;right:4px;top:4px;height:44px;min-width:52px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:var(--moss);font-size:13px;font-weight:500;}.password-toggle:hover{background:#dfe8d85c;color:var(--forest);}
.field-hint{margin:8px 0 0;color:var(--moss);font-size:12px;line-height:1.5;}.form-error{min-height:22px;margin:12px 0 16px;font-size:13px;line-height:1.6;color:var(--error);overflow-wrap:anywhere;}
.submit{position:relative;display:block;width:100%;height:50px;padding:0 20px;border:0;border-radius:5px;background:var(--grass);color:var(--forest);box-shadow:0 4px 0 var(--grass-edge);font-size:16px;font-weight:650;transition:background 130ms,transform 100ms,box-shadow 100ms;}.submit:hover{background:#a2d76a;}.submit:active{transform:translateY(3px);box-shadow:0 1px 0 var(--grass-edge);}.submit:disabled{cursor:wait;background:#adca92;box-shadow:0 4px 0 #81936e;}
.account-switch{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--moss);font-size:13px;line-height:1.5;margin:30px 0 0;}.account-switch button{border:0;padding:8px 4px;background:transparent;font-weight:650;color:#365e29;border-radius:3px;}.account-switch button:hover{text-decoration:underline;text-underline-offset:4px;}.account-switch button:disabled{cursor:wait;opacity:.55;}
.script-note{position:absolute;bottom:16px;right:40px;padding:12px 20px;background:var(--mist);color:var(--error);}
@keyframes arrive{from{opacity:0;}to{opacity:1;}}
@media(min-width:1700px){.scene-copy p{font-size:72px;}.account-content{width:420px;}h1{margin-bottom:42px;}.field input{height:56px;}.password-toggle{height:48px;}.submit{height:54px;}.scene-copy{left:64px;top:160px;}.site-header{left:60px;top:36px;}}
@media(max-width:1199px) and (min-width:1001px){.scene-copy p{font-size:48px;}}
@media(max-width:1000px) and (min-width:761px){.login-page{grid-template-columns:52% 48%;}.account{padding-right:32px;padding-left:20px;}.scene-copy{left:32px;top:130px;}.scene-copy p{font-size:48px;}.site-header{left:28px;}.world{object-position:42% bottom;}}
@media(max-width:760px){.login-page{display:block;min-height:100svh;padding:0 24px 40px;overflow:hidden;}.site-header{position:relative;inset:auto;padding-top:22px;}.site-brand{gap:5px;}.site-brand>img{width:36px;height:36px;}.brand-wordmark{width:126px;height:26px;}.world{width:100%;height:330px;object-fit:cover;object-position:left bottom;mask-image:linear-gradient(#000 68%,transparent);}.scene-copy{display:none;}.account{position:relative;padding:268px 0 0;}.account-content{width:min(100%,400px);}h1{font-size:28px;margin-bottom:28px;}.field+.field{margin-top:20px;}.account-switch{margin-top:24px;}.script-note{position:relative;inset:auto;}}
@media(max-width:380px){.login-page{padding-inline:20px;}.account{padding-top:240px;}.world{height:304px;}h1{font-size:26px;}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;}}
