log_format joincraft_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
map $http_upgrade $joincraft_connection {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    server_name www.joincraft.top;
    server_tokens off;
    access_log /dev/stdout joincraft_safe;
    client_max_body_size 400k;
    location /updates/ {
        root /srv;
        autoindex off;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://172.18.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $joincraft_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
