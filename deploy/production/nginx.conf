# Disk cache for fixed public Minecraft dependency origins. No arbitrary URL proxy.
proxy_cache_path /var/cache/joincraft-downloads levels=1:2 keys_zone=joincraft_assets:8m max_size=3g min_free=4g inactive=14d use_temp_path=off;
limit_conn_zone $binary_remote_addr zone=joincraft_download_clients:1m;
limit_conn_zone $server_name zone=joincraft_download_total:1m;
limit_req_zone $binary_remote_addr zone=joincraft_download_rate:1m rate=120r/s;
map $request_uri $joincraft_download_source {
    default "";
    ~^/game-downloads/([a-z-]+)/ $1;
}
map $joincraft_download_source $joincraft_download_host {
    default "";
    forge maven.minecraftforge.net;
    forge-files files.minecraftforge.net;
    neoforge maven.neoforged.net;
    minecraft-meta piston-meta.mojang.com;
    minecraft-data piston-data.mojang.com;
    minecraft-launcher launcher.mojang.com;
    minecraft-runtime launchermeta.mojang.com;
    minecraft-assets resources.download.minecraft.net;
    minecraft-libraries libraries.minecraft.net;
    fabric-meta meta.fabricmc.net;
    fabric-maven maven.fabricmc.net;
    quilt-meta meta.quiltmc.org;
    quilt-maven maven.quiltmc.org;
    maven-central repo1.maven.org;
    modrinth cdn.modrinth.com;
    curseforge mediafilez.forgecdn.net;
    curseforge-files mediafiles.forgecdn.net;
    curseforge-edge edge.forgecdn.net;
}
map $request_uri $joincraft_download_path {
    default "";
    ~^/game-downloads/[a-z-]+(/[^?]+)$ $1;
}
map $joincraft_download_path $joincraft_download_metadata {
    default 0;
    ~\.json$ 1;
    ~/(json|json/)$ 1;
}
log_format joincraft_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
map $http_upgrade $joincraft_connection {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    server_name www.joincraft.top;
    server_tokens off;
    set_real_ip_from 172.18.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    access_log /dev/stdout joincraft_safe;
    client_max_body_size 400k;
    location /game-downloads/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($joincraft_download_host = "") { return 404; }
        if ($joincraft_download_path = "") { return 400; }
        limit_conn joincraft_download_clients 96;
        limit_conn joincraft_download_total 256;
        limit_req zone=joincraft_download_rate burst=256 nodelay;
        limit_req_status 429;
        limit_conn_status 429;
        resolver 127.0.0.11 valid=300s ipv6=off;
        resolver_timeout 5s;
        proxy_pass https://$joincraft_download_host$joincraft_download_path;
        proxy_http_version 1.1;
        proxy_set_header Host $joincraft_download_host;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Range "";
        proxy_set_header If-Range "";
        proxy_set_header User-Agent "joincraft-download-cache/1";
        proxy_ssl_server_name on;
        proxy_ssl_name $joincraft_download_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 5;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        send_timeout 60s;
        proxy_redirect off;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
        proxy_max_temp_file_size 768m;
        proxy_cache joincraft_assets;
        proxy_cache_key "$joincraft_download_host$joincraft_download_path";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_cache_valid 200 7d;
        proxy_cache_revalidate on;
        proxy_cache_bypass $joincraft_download_metadata;
        proxy_no_cache $joincraft_download_metadata;
        proxy_force_ranges on;
        add_header X-Joincraft-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /updates/ {
        root /srv;
        autoindex off;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~ ^/api/rooms/[a-f0-9-]+/pack$ {
        client_max_body_size 24m;
        proxy_pass http://172.18.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $joincraft_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ~ ^/api/rooms/[a-f0-9-]+/pack/uploads/[a-f0-9-]+/chunk$ {
        client_max_body_size 4m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_pass http://172.18.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $joincraft_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        proxy_pass http://172.18.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $joincraft_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
