services:
  voice:
    image: livekit/livekit-server:v1.13.11
    container_name: joincraft-livekit
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - /etc/joincraft/livekit.yaml:/etc/livekit.yaml:ro
    mem_limit: 256m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  nginx:
    image: nginx:stable-alpine
    container_name: joincraft-nginx
    restart: unless-stopped
    networks: [edge]
    volumes:
      - /opt/joincraft/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/lib/docker/volumes/remotescreen_caddy_data/_data/joincraft-releases:/srv/updates:ro
    mem_limit: 64m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
networks:
  edge:
    external: true
    name: remotescreen_remotescreen
